name: Actualizar datos del screener

on:
  schedule:
    # 12:00 UTC = 14:00 en Valencia en horario de verano (CEST, UTC+2).
    # En horario de invierno (CET, UTC+1) esto correspondera a las 13:00.
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # tambien permite lanzarlo a mano desde GitHub

permissions:
  contents: write   # necesario para poder hacer commit del CSV actualizado

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos actualizados
        run: python fetch_data.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f market_data.csv market_data_meta.json
          git diff --staged --quiet || git commit -m "Actualizacion automatica de datos ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
